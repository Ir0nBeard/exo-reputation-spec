name: Bug report
description: Something in the spec, schema, verifier, or docs is wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If this is a security issue, do NOT use
        this template — report it privately via SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What is wrong?
      description: Clear, concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands run (e.g. the verifier invocation), files involved, and observed output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python / eth_account versions or language stack, if relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I ran the verifier self-test (`python3 tests/vectors/self_test.py`) and it passes.
        - label: This is not a security issue (those go through SECURITY.md).
